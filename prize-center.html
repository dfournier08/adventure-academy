<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grown-Up Prize Center</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#fff7fb,#eaf8ff);color:#34254a}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border-radius:26px;padding:24px;box-shadow:0 16px 40px #4b376222}.row{display:grid;grid-template-columns:260px 1fr;gap:12px;align-items:center;margin:10px 0}input{padding:11px;border:2px solid #dfd4ef;border-radius:12px;width:100%}.btn{border:0;border-radius:15px;padding:12px 17px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#ff5fbe,#8b5cf6);color:#fff}.secondary{background:#eef3ff}.notice{background:#fff3bd;border-radius:16px;padding:14px;margin:14px 0}.hidden{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head>
<body><div class="wrap">
<div id="gate" class="card"><h1>🔐 Grown-Ups Only</h1><p>Enter the 4-digit PIN to open the Prize Center.</p><input id="pin" type="password" inputmode="numeric" maxlength="4"><p id="err" style="color:#b52d3a"></p><button class="btn primary" onclick="unlock()">Open Prize Center</button> <button class="btn secondary" onclick="location.href='index.html'">Back</button></div>
<div id="center" class="card hidden"><h1>🎟 Prize Center</h1><p>Configure rewards privately before they are earned.</p><div class="notice">Prize values are not displayed on the child-facing Adventure Hub.</div><div id="fields"></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn primary" onclick="saveAll()">Save All Prizes</button><button class="btn secondary" onclick="location.href='index.html'">← Adventure Hub</button></div></div>
</div>
<script>
const PIN_KEY='adventureAcademyAdultPin_v041',DEFAULT_PIN='2468',KEY='academyPrizeCenter_v04';
const worlds=['Glam Quest','Leadership Academy','Detective Academy','Code Quest','Science Lab','Business Boulevard','Inventor Lab',"Grandpa's Workshop","Grandma's Creative Workshop",'Family Super Challenges'];
const defaults={glamSections:Array(15).fill('Small Prize'),glamGrand:'Glam Quest Grand Prize',worldRewards:{}};
let data; function unlock(){if(document.getElementById('pin').value!==(localStorage.getItem(PIN_KEY)||DEFAULT_PIN)){document.getElementById('err').textContent='That PIN did not match.';return}document.getElementById('gate').classList.add('hidden');document.getElementById('center').classList.remove('hidden');load()}
function load(){try{data={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=defaults}render()}
function render(){const f=document.getElementById('fields');f.innerHTML='<h2>Glam Quest — Section Prizes</h2>';for(let i=0;i<15;i++){let r=document.createElement('div');r.className='row';r.innerHTML=`<strong>Section ${i+1}</strong><input id="g${i}">`;f.appendChild(r);document.getElementById('g'+i).value=data.glamSections?.[i]||''}let r=document.createElement('div');r.className='row';r.innerHTML='<strong>Glam Grand Prize</strong><input id="glamGrand">';f.appendChild(r);document.getElementById('glamGrand').value=data.glamGrand||'';f.insertAdjacentHTML('beforeend','<h2>Other World Rewards</h2>');worlds.slice(1).forEach((w,i)=>{let x=document.createElement('div');x.className='row';x.innerHTML=`<strong>${w}</strong><input id="w${i}">`;f.appendChild(x);document.getElementById('w'+i).value=data.worldRewards?.[w]||'World Prize'})}
function saveAll(){data.glamSections=Array.from({length:15},(_,i)=>document.getElementById('g'+i).value.trim()||'Small Prize');data.glamGrand=document.getElementById('glamGrand').value.trim()||'Glam Quest Grand Prize';data.worldRewards={};worlds.slice(1).forEach((w,i)=>data.worldRewards[w]=document.getElementById('w'+i).value.trim()||'World Prize');localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem('glamQuestPrizeBridge_v04',JSON.stringify({sections:data.glamSections,grand:data.glamGrand}));alert('Prize settings saved.')}
</script></body></html>
