<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Glam Quest</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffe3f2,#eee3ff);color:#34254a}
.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);padding:10px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:2px solid #eadcff}
a{display:inline-block;padding:10px 14px;border-radius:14px;text-decoration:none;font-weight:900}.hub{background:#f4eefb;color:#34254a}.game{width:100%;height:calc(100vh - 64px);border:0}
</style>
</head>
<body>
<div class="top">
  <strong>👗 Glam Quest</strong>
  <a class="hub" href="../../index.html">← Adventure Hub</a>
</div>
<iframe id="game" class="game" src="glam-quest-academy-v2.html" title="Glam Quest"></iframe>
<script>
// Bridge Prize Center values into the legacy Glam Quest localStorage if available.
try{
  const bridge=JSON.parse(localStorage.getItem('glamQuestPrizeBridge_v04')||'null');
  if(bridge){
    const raw=localStorage.getItem('glamQuestV2');
    if(raw){
      const s=JSON.parse(raw);
      if(Array.isArray(bridge.sections) && bridge.sections.length===15){
        s.prizes=[bridge.sections.slice(0,3),bridge.sections.slice(3,6),bridge.sections.slice(6,9),bridge.sections.slice(9,12),bridge.sections.slice(12,15)];
      }
      if(bridge.grand) s.grandPrize=bridge.grand;
      localStorage.setItem('glamQuestV2',JSON.stringify(s));
    }
  }
}catch(e){}
</script>
</body></html>
